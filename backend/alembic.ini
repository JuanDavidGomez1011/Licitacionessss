# Configuracion de Alembic.
#
# `sqlalchemy.url` se deja VACIO a proposito: `alembic/env.py` lo rellena desde
# `app.config.settings`, que es la unica fuente de verdad (viene de `.env`). Asi
# la migracion y la app nunca pueden apuntar a bases distintas.
#
# Para migrar otra base sin tocar `.env`:
#   $env:ALEMBIC_DATABASE_URL="postgresql+psycopg://.../otra_base"
#   ..\.venv\Scripts\python.exe -m alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
